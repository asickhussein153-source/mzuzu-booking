<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Booking Requests</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{background:#f0f2f5;padding:20px;color:#222}
.header{background:#1a3a5a;color:#fff;padding:22px 25px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.header h1{font-size:22px}
.header p{font-size:13px;opacity:.8;margin-top:4px}
.header a{color:#fff;text-decoration:none;background:rgba(255,255,255,.18);padding:9px 16px;border-radius:20px;font-size:14px}
.topbar{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}
.topbar button,.topbar select{padding:10px 16px;border:1px solid #ddd;border-radius:20px;background:#fff;cursor:pointer;font-size:14px}
.topbar button{ background:#1a3a5a;color:#fff;border:none;font-weight:600}
#msg{background:#d4edda;color:#155724;padding:12px 16px;border-radius:10px;margin-bottom:15px;display:none}
#msg.show{display:block}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#f8f9fa;padding:14px 12px;text-align:left;color:#666;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td{padding:14px 12px;border-top:1px solid #eee;vertical-align:top}
tr:hover td{background:#f9fbff}
.badge{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700}
.Pending{background:#fff3cd;color:#856404}
.Approved{background:#d4edda;color:#155724}
.Rejected{background:#f8d7da;color:#721c2424o
.reason{font-size:12px;color:#721c24;background:#fdecea;padding:6px 8px;border-radius:6px;margin-top:6px;display:inline-block}
.btn{padding:7px 13px;border:none;border-radius:20px;cursor:pointer;font-weight:600;font-size:13px;color:#fff}
.approve{background:#28a745}
.reject{background:#dc3545}
.btn:disabled{opacity:.4;cursor:not-allowed}
.empty{text-align:center;padding:50px;color:#888}
.empty b{font-size:18px;color:#444}
/* Modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-box{background:#fff;width:100%;max-width:450px;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal-box h3{font-size:19px;margin-bottom:6px}
.modal-box p{font-size:13px;color:#666;margin-bottom:12px}
.modal-box textarea{width:100%;height:100px;padding:12px;border:1px solid #ddd;border-radius:10px;resize:none;font-size:14px;outline:none}
.modal-box textarea:focus{border-color:#dc3545}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.modal-btns button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px}
.send{background:#dc3545;color:#fff}
.cancel{background:#eee}
@media(max-width:700px){table,thead,tbody,tr,th,td{display:block}thead{display:none}tr{border-bottom:8px solid #f0f2f5}td{border:none}td:before{content:attr(data-label);font-weight:700;color:#888;font-size:11px;display:block;text-transform:uppercase}}
</style>
</head>
<body>
<div class="header">
<div><h1>🏫 Admin - Booking Requests</h1><p>Manage student room bookings - Mzuzu University</p></div>
<a href="home.html">← Back to Home</a>
</div>

<div class="topbar">
<button onclick="loadBookings()">🔄 Refresh</button>
<select id="filter" onchange="loadBookings()">
<option value="All">All Status</option>
<option value="Pending">Pending Only</option>
<option value="Approved">Approved Only</option>
<option value="Rejected">Rejected Only</option>
</select>
</div>

<div id="msg"></div>

<div class="card">
<table>
<thead><tr><th>Student</th><th>Room / Details</th><th>Date</th><th>Status</th><th>Action</th></tr></thead>
<tbody id="list"></tbody>
</table>
<div id="empty" class="empty" style="display:none"><b>No requests yet</b><br>New bookings will appear here.</div>
</div>

<div id="reasonBox" class="modal">
<div class="modal-box">
<h3>❌ Reject Booking</h3>
<p>Please write the reason for rejection. The student will see this.</p>
<textarea id="reasonText" placeholder="Example: Room already booked for exam..."></textarea>
<div class="modal-btns">
<button class="cancel" onclick="cancelReject()">Cancel</button>
<button class="send" onclick="confirmReject()">Send Rejection</button>
</div>
</div>
</div>

<script>
let allBookings = [];
let pendingRejectId = null;

async function loadBookings(){
  const res = await fetch('/api/bookings');
  allBookings = await res.json();
  const filter = document.getElementById('filter').value;
  const filtered = filter==='All' ? allBookings : allBookings.filter(b=>b.status===filter);
  const list = document.getElementById('list');
  document.getElementById('empty').style.display = filtered.length ? 'none' : 'block';

list.innerHTML = filtered.map(b => `
    <tr>
        <td data-label="Student">
            <b>${b.fullName || b.name || 'Student'}</b>
            <br>${b.email || ''}
            <br>${b.phone || ''}
        </td>

        <td data-label="Room">
            <b>${b.room || 'N/A'}</b>
            <br>${b.purpose || ''}
        </td>

        <td data-label="Date">
            ${b.bookingDate || b.date || 'N/A'}
        </td>

        <td data-label="Status">
            <span class="badge ${b.status}">
                ${b.status || 'Pending'}
            </span>
        </td>

        <td data-label="Action">
            ${b.status === 'Pending' ? `
                <button class="btn approve"
                    onclick="respond(${b.id}, 'Approved')">
                    ✓ Approve
                </button>

                <button class="btn reject"
                    onclick="askReject(${b.id})">
                    ✕ Reject
                </button>
            ` : 'No action'}
        </td>
    </tr>
`).join('');

    try {

        const res = await fetch(`/api/bookings/${id}`, {

            method: 'PUT',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                status: status,
                reason: ''
            })

            loadBookings();
        }

        showMsg(data.message || 'Updated');

        if (res.ok) {
            loadBookings();
        }

    } catch (err) {

        console.error(err);
        showMsg('Unable to connect to server');
   }
}
function askReject(id){
  pendingRejectId = id;
  document.getElementById('reasonText').value='';
  document.getElementById('reasonBox').classList.add('show');
  document.getElementById('reasonText').focus();
}
function cancelReject(){
  pendingRejectId=null;
  document.getElementById('reasonBox').classList.remove('show');
}
async function confirmReject(){
  const reason = document.getElementById('reasonText').value.trim();
  if(!reason){ alert('Please write reason for rejection'); return; }
  const res = await fetch(`/api/bookings/${pendingRejectId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'Rejected',reason, rejectionReason:reason})});
  const d = await res.json();
  showMsg(d.message||'Rejected');
  document.getElementById('reasonBox').classList.remove('show');
  pendingRejectId=null;
  loadBookings();
}
function showMsg(t){ const m=document.getElementById('msg'); m.innerText=t; m.classList.add('show'); setTimeout(()=>m.classList.remove('show'),3000); }
loadBookings();
</script>
</body>
</html>
