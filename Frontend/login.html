<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Student Login | Mzuzu University</title>

    <link rel="stylesheet" href="css/style.css">
<style>footer{background:#14532d;background-image:none;color:white} footer a{color:#d1fae5} footer p,footer h3,footer h4{color:white}</style></head>

<body>

    <!-- University Header -->
    <header class="university-header">

        <img src="images/Mzuni-logo.jpg"
             alt="Mzuzu University Logo"
             class="university-logo">

        <div>
            <h2>Mzuzu University</h2>
            <p>Room Booking Management System</p>
        </div>

    </header>

    <!-- Navigation -->
    <nav>
        <a href="home.html">Home</a>
        <a href="rooms.html">Rooms</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>

    <!-- Login Form -->
    <main class="login-container">

        <div class="login-box">

            <h1>Student Login</h1>

            <p>Login to access the room booking system.</p>

            <form id="loginForm">

                <label for="studentID">
                    Email
                </label>

                <input type="email" id="email" name="email" required>

                <label for="password">
                    Password
                </label>

                <input type="password" id="password" name="password" required>

                <button type="submit">
                    Login
                </button>

            </form>

            <p>
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>

            <p>
                <a href="home.html">Back to Home</a>
            </p>

        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Mzuzu University. All Rights Reserved.</p>
    </footer>

<script>
const loginForm = document.querySelector('form');

loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
        alert('Please enter your email and password.');
        return;
    }

    try {
        const res = await fetch('http://localhost:3000/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const data = await res.json();

        if (!res.ok) {
            alert(data.message || 'Login failed.');
            return;
        }

        // Save information returned by Express
        localStorage.setItem('token', data.token);
        localStorage.setItem('name', data.name);
        localStorage.setItem('email', data.email);
        localStorage.setItem('role', data.role);

        // Redirect according to account role
        if (data.role === 'admin') {
            window.location.href = '/admin.html';
        } else if (data.role === 'student' || data.role === 'user') {
            window.location.href = '/dashboard.html';
        } else {
            alert('Unknown user role: ' + data.role);
        }

    } catch (error) {
        console.error('Login error:', error);
        alert('Server connection failed. Please try again.');
    }
});
</script>
</body>
</html>
