<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Booking Requests</title>
<style>
body{font-family:sans-serif;background:#eef2f5;margin:0;padding:16px}
.card{background:#0b3d66;color:#fff;padding:20px;border-radius:16px}
button{padding:10px 16px;border-radius:20px;border:0;cursor:pointer}
table{width:100%;border-collapse:collapse;background:#fff;margin-top:16px;border-radius:12px;overflow:hidden}
th,td{padding:12px;text-align:left;border-bottom:1px solid #eee}
.approve{background:#16a34a;color:#fff}
.reject{background:#dc2626;color:#fff}
</style>
</head>
<body>
<div class="card">
<h2>🏫 Admin - Booking Requests</h2>
<p>Manage student room bookings - Mzuzu University</p>
<a href="/" style="color:#fff">← Back to Home</a>
</div>

<div style="margin-top:16px;display:flex;gap:10px">
<button onclick="loadBookings()">🔄 Refresh</button>
<select id="filter" onchange="loadBookings()">
<option>All Status</option>
<option>Pending</option>
<option>Approved</option>
<option>Rejected</option>
</select>
</div>

<p id="empty" style="display:none">No bookings found.</p>
<table>
<thead><tr><th>STUDENT</th><th>ROOM / DETAILS</th><th>DATE</th><th>STATUS</th><th>ACTION</th></tr></thead>
<tbody id="list"></tbody>
</table>
<p id="msg"></p>

<script>
let allBookings = [];
async function loadBookings(){
  try{
    const res = await fetch('http://localhost:3000/api/bookings');
    allBookings = await res.json();
  }catch(e){ allBookings = []; }
  const filter = document.getElementById('filter').value;
  const filtered = (filter==='All Status'||filter==='All'||filter===''||filter==='all') ? allBookings : allBookings.filter(b=>b.status===filter);
  document.getElementById('empty').style.display = filtered.length ? 'none':'block';
  document.getElementById('list').innerHTML = filtered.map(b=>`
    <tr>
      <td><b>${b.fullName||b.name||'Student'}</b><br>${b.email||''}<br>${b.phone||''}</td>
      <td>${b.room||b.roomType||''}<br>${b.hostel||''} ${b.block||''}</td>
      <td>${b.date||b.createdAt||''}</td>
      <td>${b.status||'Pending'}</td>
      <td>
        <button class="approve" onclick="respond('${b._id||b.id}','Approved')">Approve</button>
        <button class="reject" onclick="respond('${b._id||b.id}','Rejected')">Reject</button>
      </td>
    </tr>`).join('');
}
async function respond(id,status){
  let reason = '';
  if(status==='Rejected'){ reason = prompt('Reason for rejection?') || ''; }
  const res = await fetch('http://localhost:3000/api/bookings/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({status, reason})
  });
  const data = await res.json().catch(()=>({}));
  document.getElementById('msg').textContent = data.message || 'Booking updated';
  loadBookings();
}
loadBookings();
</script>
</body>
</html>
